name: Build and Push

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  ORG: tinfoilsh

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: code-exec-api-server
            context: ./api-server
          - name: code-exec-environment
            context: ./executor
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image.name }}:latest
