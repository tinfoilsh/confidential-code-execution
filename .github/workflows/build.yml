name: Build and Push

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  ORG: tinfoilsh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/code-exec-orchestrator:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/code-exec-orchestrator:latest
