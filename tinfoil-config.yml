shim-version: v0.3.18@sha256:7d9f98be78c91ede89f43c948a12d084fae34312effe9395ca7ed572991cb561
cvm-version: 0.7.5
cpus: 2
# Sized for 4 concurrent snapshot/restore ops (MAX_CONCURRENT_SNAPSHOTS=4).
# 4x3=12GB + 4GB overhead
memory: 16384

containers:
  - name: "orchestrator"
    image: "ghcr.io/tinfoilsh/confidential-code-execution@sha256:5441b18057db736250c6cdcd751922ec2f01a1a96e3215993a824f4d3e9a55f5" # v0.0.2
    env:
      - POOL_SIZE: "4"
      - IDLE_TIMEOUT: "180"
    secrets:
      - SCOPED_CODE_EXEC_ADMIN_KEY

shim:
  listen-port: 443
  upstream-port: 7070
  paths:
    - /mcp
    - /metrics
